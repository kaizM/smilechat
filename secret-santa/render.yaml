services:
  - type: web
    name: lemur-secret-santa
    rootDir: secret-santa
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt httpx==0.28.1
    startCommand: python preflight.py && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lemur-santa-db
          property: connectionString
databases:
  - name: lemur-santa-db
    plan: free
    region: ohio
    ipAllowList: []
